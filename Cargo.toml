[package]
name = "installer"
version = "0.1.1"
rust-version = "1.95.0"
edition = "2024"

[dependencies]
firefly-keyboard = "0.1.3"
firefly-rust = { version = "0.14.0", features = ["talc"] }
firefly-sudo = { version = "0.14.0", features = ["alloc"] }
firefly-ui = "0.3.1"
firefly-types = "0.10.0"
# Updating sha2 to 0.11.0 adds 4kb to the binary size.
# The changelog doesn't provide a good explanation on why it might be.
# So, why update? If it works, it works.
sha2 = { version = "0.11.0", default-features = false }

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true    # Automatically strip symbols from the binary.
opt-level = "s" # Optimize for speed.
lto = true      # Enable link-time optimization
