[package]
name = "installer"
version = "0.2.1"
rust-version = "1.100.0"
edition = "2024"

[dependencies]
firefly-keyboard = "0.1.5"
firefly-rust = { version = "0.17.1", features = ["talc"] }
firefly-sudo = { version = "0.14.5", features = ["alloc"] }
firefly-ui = "0.3.3"
firefly-types = "0.12.1"
# Updating sha2 to 0.11.0 adds 4kb to the binary size.
# The changelog doesn't provide a good explanation on why it might be.
# So, why update? If it works, it works.
sha2 = { version = "0.11.1", default-features = false }

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = 3 # Optimize for speed.
lto = true    # Enable link-time optimization
